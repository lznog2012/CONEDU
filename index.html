<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONEDU 2026 - SUPERMERCADO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#13203B; --muted:#5B6783; --line:#D9DFEA;
  --yellow:#FFD23F; --on-yellow:#13203B;
  --coletivo:#1F5FBF; --coletivo-bg:#E3EDFB;
  --individual:#C2490F; --individual-bg:#FDEBDD;
  --danger:#C62F3B; --ok:#1E8E5A;
  --head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#18223A; --ink:#EEF2FB; --muted:#9AA7C4; --line:#2A3656;
    --coletivo:#7DB0FF; --coletivo-bg:#1B2E52;
    --individual:#FFA46B; --individual-bg:#4A2B16;
    --danger:#FF7B86; --ok:#5ED39A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#18223A; --ink:#EEF2FB; --muted:#9AA7C4; --line:#2A3656;
  --coletivo:#7DB0FF; --coletivo-bg:#1B2E52;
  --individual:#FFA46B; --individual-bg:#4A2B16;
  --danger:#FF7B86; --ok:#5ED39A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--coletivo);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:150px}
.top{background:var(--yellow);color:var(--on-yellow);padding:14px 16px 12px;border-bottom:4px solid var(--on-yellow)}
.top h1{margin:0;font-family:var(--head);font-weight:800;font-size:30px;line-height:1;letter-spacing:.2px}
.top p{margin:4px 0 0;font-size:14px;font-weight:500;opacity:.85}
.panel{display:none;padding:14px 14px 0}
.panel.on{display:block}
.form{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px}
.form.editing{border-color:var(--coletivo);box-shadow:0 0 0 3px var(--coletivo-bg)}
.row{display:flex;gap:10px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.input{width:100%;height:52px;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:18px;font-weight:500}
.input:focus{border-color:var(--coletivo);outline:none}
.price-wrap{position:relative}
.price-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.price-wrap .input{padding-left:42px;font-family:var(--head);font-size:26px;font-weight:700}
.qty{display:flex;align-items:center;height:52px;border:2px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.qty button{width:40px;height:100%;font-size:24px;font-weight:700}
.qty button:active{background:var(--line)}
.qty output{min-width:30px;text-align:center;font-family:var(--head);font-size:24px;font-weight:700}
.field.qtyf{flex:0 0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.seg button{height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;line-height:1.1}
.seg button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.seg button.on.col{background:var(--coletivo);border-color:var(--coletivo);color:#fff}
.seg button.on.ind{background:var(--individual);border-color:var(--individual);color:#fff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .seg button.on{color:#0E1526}
  :root:not([data-theme="light"]) .seg button.on small{color:#0E1526}
}
:root[data-theme="dark"] .seg button.on,:root[data-theme="dark"] .seg button.on small{color:#0E1526}
.seg button.on small{color:inherit;opacity:.85}
.who-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.who-head b{font-size:14px;color:var(--muted);font-weight:600}
.link{color:var(--coletivo);font-weight:600;font-size:14px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on.col{background:var(--coletivo-bg);border-color:var(--coletivo);color:var(--coletivo)}
.chip.on.ind{background:var(--individual-bg);border-color:var(--individual);color:var(--individual)}
.chip.on::before{content:"✓ "}
.preview{margin:12px 0 0;min-height:22px;font-weight:600;color:var(--muted);font-size:15px}
.preview strong{color:var(--ink)}
.err{color:var(--danger);font-weight:600;font-size:14px;min-height:18px;margin-top:6px}
.add{width:100%;height:58px;margin-top:6px;border-radius:12px;background:var(--ink);color:var(--surface);font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:.3px}
.add:active{transform:scale(.99)}
.cancel{width:100%;height:44px;margin-top:6px;color:var(--muted);font-weight:600}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.list-head h2{margin:0;font-family:var(--head);font-size:22px;font-weight:700}
.list-head span{color:var(--muted);font-size:14px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:2px dashed var(--line);border-radius:14px;font-weight:500}
.item{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.item.col{border-left-color:var(--coletivo)}
.item.ind{border-left-color:var(--individual)}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted);margin-top:2px}
.item .sub b{font-weight:600}
.item .sub .t-col{color:var(--coletivo)} .item .sub .t-ind{color:var(--individual)}
.item .val{font-family:var(--head);font-size:24px;font-weight:700;white-space:nowrap}
.item .acts{display:flex;flex-direction:column;gap:2px}
.icon{width:38px;height:34px;border-radius:8px;font-size:17px}
.icon:active{background:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:64px}
.card summary::-webkit-details-marker{display:none}
.card .pn{flex:1;font-weight:700;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pn small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.card .tot{font-family:var(--head);font-weight:800;font-size:30px;white-space:nowrap}
.card .chev{color:var(--muted);transition:transform .15s}
.card[open] .chev{transform:rotate(90deg)}
.card .body{border-top:1px solid var(--line);padding:6px 14px 12px}
.card .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.card .ln:last-child{border-bottom:0}
.card .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tag{font-size:12px;font-weight:600;margin-left:6px}
.tag.c{color:var(--coletivo)} .tag.i{color:var(--individual)}
.grand{background:var(--ink);color:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grand .l{font-weight:600}
.grand .l small{display:block;font-weight:500;opacity:.75;font-size:13px}
.grand .v{font-family:var(--head);font-size:38px;font-weight:800}
.btn{width:100%;height:54px;border-radius:12px;font-weight:700;font-size:17px;margin-bottom:10px}
.btn.primary{background:var(--yellow);color:var(--on-yellow);border:2px solid var(--on-yellow)}
.btn.ghost{border:2px solid var(--line);background:var(--surface)}
.btn.danger{border:2px solid var(--danger);color:var(--danger);background:var(--surface)}
.people .p{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.people .p i{flex:0 0 36px;height:36px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-style:normal;font-family:var(--head);font-weight:800;font-size:20px}
.hint{color:var(--muted);font-size:14px;margin:0 2px 14px}
.list-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:82px;transition:transform .08s}
.list-card:active{transform:scale(.995);background:var(--bg)}
.list-card .lc-info{flex:1;min-width:0}
.list-card .lc-title{font-family:var(--head);font-size:24px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-card .lc-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:500}
.list-card .lc-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.list-card .lc-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.list-card .lc-chev{font-size:32px;color:var(--muted);font-family:var(--head);font-weight:700;flex:0 0 auto}
.detail-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.detail-head .back{flex:0 0 44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;display:grid;place-items:center}
.detail-head .back:active{background:var(--bg)}
.detail-head .title-wrap{flex:1;min-width:0}
.detail-head input.title{width:100%;height:44px;background:transparent;border:2px solid transparent;border-radius:10px;padding:0 8px;font-family:var(--head);font-size:26px;font-weight:700;color:var(--ink)}
.detail-head input.title:hover{border-color:var(--line)}
.detail-head input.title:focus{border-color:var(--coletivo);outline:none;background:var(--surface)}
.detail-head .del{flex:0 0 44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.detail-head .del:active{background:var(--bg);border-color:var(--danger)}
.addrow{display:flex;gap:8px}
.addrow .input{flex:1}
.addrow button{flex:0 0 auto;width:56px;height:52px;border-radius:10px;background:var(--ink);color:var(--surface);font-family:var(--head);font-size:28px;font-weight:800}
.progress{margin:14px 2px 6px;font-weight:600;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 2px 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

/* === ITEM DA LISTA === */
.sh{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding-right:6px}
.sh-info{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 4px 8px 12px;justify-content:center;gap:2px}
.sh .tog{display:flex;align-items:center;gap:12px;text-align:left;font-size:18px;font-weight:600;padding:0;background:none;min-height:32px;color:inherit}
.sh .box{flex:0 0 28px;height:28px;border-radius:8px;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:18px;line-height:1;color:transparent}
.sh .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh.done{background:transparent}
.sh.done .nm{text-decoration:line-through;color:var(--muted);font-weight:500}
.sh.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.sh .price{flex:0 0 auto;height:40px;padding:0 10px;border-radius:8px;background:var(--yellow);color:var(--on-yellow);font-weight:700;font-size:14px;border:2px solid var(--on-yellow)}
.sh-hint{font-size:12px;color:var(--individual);text-align:left;font-weight:700;padding:0 0 0 40px;text-decoration:underline;text-underline-offset:2px;align-self:flex-start;background:none;border:none;cursor:pointer;line-height:1.3;margin-top:1px}
.sh-hint:active{opacity:.7}

.cat-head{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.cat-head:first-child{margin-top:6px}
.cat-head .cat-em{font-size:24px;line-height:1}
.cat-head .cat-name{font-family:var(--head);font-size:20px;font-weight:800;color:var(--ink)}
.cat-head .cat-count{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);background:var(--line);padding:2px 9px;border-radius:999px}
.sub-h{margin:18px 2px 8px;font-family:var(--head);font-size:20px;font-weight:700}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:560px;margin:0 auto}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 0}
.totalbar span{font-size:14px;font-weight:600;color:var(--muted)}
.totalbar b{font-family:var(--head);font-size:28px;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:54px;font-weight:600;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.tabs button em{font-style:normal;font-size:20px}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--yellow);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.sync{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;z-index:8;opacity:0;transition:opacity .3s}
.sync.on{opacity:1}
.sync.ok{border-color:var(--ok);color:var(--ok)}
.sync.err{border-color:var(--danger);color:var(--danger)}

/* === SHEET (seletor de categoria) === */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on .sheet-in{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head b{font-family:var(--head);font-size:22px;font-weight:800}
.sheet-head button{width:40px;height:40px;border-radius:10px;font-size:18px;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.cat-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-option{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;text-align:left;min-height:56px}
.cat-option:active{background:var(--line)}
.cat-option.on{background:var(--coletivo-bg);border-color:var(--coletivo);color:var(--coletivo)}
.cat-option .em{font-size:22px;line-height:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>CONEDU 2026 - SUPERMERCADO</h1>
    <p>Adicione o item, escolha quem paga, pronto.</p>
  </header>

  <div class="sync" id="sync">Conectando…</div>

  <section class="panel on" id="p-lista" role="tabpanel">
    <div id="lists-view">
      <div id="lists-cards"></div>
      <button class="btn ghost" id="add-list" style="margin-top:6px">+ Nova lista</button>
    </div>
    <div id="list-detail" style="display:none">
      <div class="detail-head">
        <button type="button" class="back" id="back-lists" aria-label="Voltar">‹</button>
        <div class="title-wrap">
          <input type="text" class="title" id="list-title" maxlength="40" aria-label="Nome da lista">
        </div>
        <button type="button" class="del" id="del-list" aria-label="Excluir lista">🗑️</button>
      </div>
      <div class="addrow">
        <input class="input" id="sh-nome" type="text" placeholder="O que precisa comprar?" autocomplete="off" enterkeyhint="done" aria-label="Novo item da lista">
        <button type="button" id="sh-add" aria-label="Adicionar à lista">+</button>
      </div>
      <p class="hint" style="margin:8px 2px 0">Dica: escreva vários separados por vírgula (arroz, feijão, café).</p>
      <div class="progress"><span id="sh-count"></span><button type="button" class="link" id="sh-clear" hidden>Limpar comprados</button></div>
      <div class="bar"><i id="sh-bar"></i></div>
      <div id="sh-list"></div>
    </div>
  </section>

  <section class="panel" id="p-itens" role="tabpanel">
    <div class="form" id="form">
      <div class="field">
        <label for="nome">Item</label>
        <input class="input" id="nome" type="text" placeholder="Ex: arroz, cerveja, sabonete" autocomplete="off" enterkeyhint="next">
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field">
          <label for="preco">Preço (unidade)</label>
          <div class="price-wrap"><span>R$</span><input class="input" id="preco" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
        </div>
        <div class="field qtyf">
          <label>Qtd</label>
          <div class="qty">
            <button type="button" id="menos" aria-label="Diminuir quantidade">−</button>
            <output id="qtd">1</output>
            <button type="button" id="mais" aria-label="Aumentar quantidade">+</button>
          </div>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Tipo do item">
        <button type="button" class="col on" id="t-col">Coletivo<small>divide entre todos</small></button>
        <button type="button" class="ind" id="t-ind">Individual<small>só de uma pessoa</small></button>
      </div>
      <div class="who-head">
        <b id="who-label">Dividir entre:</b>
        <button type="button" class="link" id="todos">Todos</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="preview" id="preview"></div>
      <div class="err" id="err" role="alert"></div>
      <button type="button" class="add" id="add">ADICIONAR ITEM</button>
      <button type="button" class="cancel" id="cancel" hidden>Cancelar edição</button>
    </div>
    <div class="list-head"><h2>Carrinho</h2><span id="count"></span></div>
    <div id="lista"></div>
  </section>

  <section class="panel" id="p-resumo" role="tabpanel">
    <div class="grand"><div class="l">Total do carrinho<small id="g-sub"></small></div><div class="v" id="g-total">R$ 0,00</div></div>
    <div id="cards"></div>
    <button class="btn primary" id="copiar">Copiar resumo para o WhatsApp</button>
  </section>

  <section class="panel" id="p-pessoas" role="tabpanel">
    <p class="hint">Toque no nome para editar. Máximo de 20 pessoas.</p>
    <div class="people" id="people"></div>
    <button class="btn ghost" id="add-pessoa" style="margin-top:4px">+ Adicionar pessoa</button>
    <button class="btn danger" id="limpar">Limpar todos os itens</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<!-- Seletor de categoria (bottom sheet) -->
<div class="sheet" id="cat-sheet" aria-hidden="true">
  <div class="sheet-in">
    <div class="sheet-head">
      <b>Escolher categoria</b>
      <button type="button" id="cat-close" aria-label="Fechar">✕</button>
    </div>
    <div class="cat-options" id="cat-options"></div>
  </div>
</div>

<nav class="dock" aria-label="Navegação">
  <div class="in">
    <div class="totalbar"><span>Total</span><b id="dock-total">R$ 0,00</b></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="lista"><em>📝</em>Lista</button>
      <button role="tab" aria-selected="false" data-tab="itens"><em>🛒</em>Carrinho</button>
      <button role="tab" aria-selected="false" data-tab="resumo"><em>🧾</em>Resumo</button>
      <button role="tab" aria-selected="false" data-tab="pessoas"><em>👥</em>Pessoas</button>
    </div>
  </div>
</nav>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA1RF4LWskFdSEIXhm40PBxkkIv_ihBlLc",
  authDomain: "conedu2026-6a712.firebaseapp.com",
  projectId: "conedu2026-6a712",
  storageBucket: "conedu2026-6a712.firebasestorage.app",
  messagingSenderId: "55965192438",
  appId: "1:55965192438:web:14c1b7026d16ee4ed09cd7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_REF = doc(db, 'conedu2026', 'estado');

// ============================================================
// CATEGORIAS
// ============================================================
const CATEGORIES = [
  { id: 'alimento', name: 'Alimentação', emoji: '🍚' },
  { id: 'bebida',   name: 'Bebidas',     emoji: '🥤' },
  { id: 'higiene',  name: 'Higiene',     emoji: '🧴' },
  { id: 'limpeza',  name: 'Limpeza',     emoji: '🧽' },
  { id: 'outros',   name: 'Outros',      emoji: '📦' }
];

const KEYWORDS = {
  alimento: ['arroz','feijao','feijão','macarrao','macarrão','carne','frango','peixe','pao','pão','leite','queijo','ovo','ovos','acucar','açúcar','sal','oleo','óleo','azeite','cafe','café','bolacha','biscoito','biscoitos','chocolate','manteiga','margarina','farinha','trigo','molho','extrato','atum','sardinha','iogurte','requeijao','requeijão','presunto','mortadela','linguica','linguiça','salsicha','bacon','verdura','legume','fruta','banana','maca','maçã','laranja','tomate','cebola','alho','batata','cenoura','alface','cereal','granola','aveia','mel','gelatina','sobremesa','bolo','torta','hamburguer','hambúrguer','nuggets','pizza'],
  bebida: ['agua','água','suco','refrigerante','refri','coca','coca-cola','guarana','guaraná','pepsi','cerveja','vinho','vodka','whisky','energetico','energético','cha','chá','isotonico','isotônico','gatorade','schweppes','tonica','tônica'],
  higiene: ['sabonete','shampoo','condicionador','creme dental','pasta de dente','escova','desodorante','papel higienico','papel higiênico','absorvente','fralda','fraldas','algodao','algodão','cotonete','lenco','lenço','perfume','hidratante','protetor solar','gilete','lamina','lâmina','creme','pomada','fio dental','enxaguante'],
  limpeza: ['detergente','sabao em po','sabão em pó','amaciante','desinfetante','agua sanitaria','água sanitária','candida','cândida','multiuso','veja','esponja','bucha','vassoura','rodo','pano','saco de lixo','alvejante','limpa vidro','cloro','desengordurante']
};

function detectCategory(name){
  const n = norm(name);
  for(const cat of ['alimento','bebida','higiene','limpeza']){
    if(KEYWORDS[cat].some(k => n.includes(norm(k)))) return cat;
  }
  return 'outros';
}
function getCategory(id){
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
}

// ============================================================
// ESTADO
// ============================================================
const defaultNames = ['Eu', 'Pessoa 2', 'Pessoa 3', 'Pessoa 4', 'Pessoa 5'];
function newListId(){ return 'list-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

let state = {
  people: defaultNames.slice(),
  items: [],
  shoppingLists: [{ id: newListId(), name: 'Lista de compras', items: [] }]
};

const clientId = Math.random().toString(36).slice(2) + Date.now();
let applyingRemote = false;
let saveTimeout = null;
let viewListId = null;

const $ = id => document.getElementById(id);

function norm(s){ return String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function brl(c){ return (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function parsePrice(v){
  v = String(v).replace(/[^\d,.]/g,'');
  if(!v) return 0;
  if(v.indexOf(',') > -1){ v = v.replace(/\./g,'').replace(',','.'); }
  else if((v.match(/\./g)||[]).length > 1){ v = v.replace(/\./g,''); }
  const n = parseFloat(v);
  return isNaN(n) ? 0 : Math.round(n * 100);
}
function allIdx(){ return state.people.map((_, i) => i); }
function split(total, idx){
  const n = idx.length, base = Math.floor(total / n), rem = total - base * n;
  const out = {};
  idx.forEach((p, k) => { out[p] = base + (k < rem ? 1 : 0); });
  return out;
}
function itemTotal(it){ return it.price * it.qty; }
function currentList(){ return state.shoppingLists.find(x => x.id === viewListId); }

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('on'), 1800);
}
function setSync(txt, cls){
  const el = $('sync');
  el.textContent = txt;
  el.className = 'sync on' + (cls ? ' ' + cls : '');
  clearTimeout(setSync.h);
  if(cls === 'ok' || cls === 'err') setSync.h = setTimeout(() => el.classList.remove('on'), 1500);
}

function ensureCategories(){
  state.shoppingLists.forEach(l => {
    l.items.forEach(it => {
      if(!it.category) it.category = detectCategory(it.name);
    });
  });
}

function saveToCloud(){
  if(applyingRemote) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    setSync('Salvando…');
    const payload = {
      people: state.people.slice(),
      items: JSON.parse(JSON.stringify(state.items)),
      shoppingLists: JSON.parse(JSON.stringify(state.shoppingLists)),
      updatedAt: Date.now(),
      lastWriter: clientId
    };
    try{
      await setDoc(DOC_REF, payload);
      setSync('Sincronizado ✓', 'ok');
    }catch(e){
      console.error('Erro ao salvar:', e);
      setSync('Erro ao salvar', 'err');
    }
  }, 150);
}

onSnapshot(DOC_REF, snapshot => {
  if(!snapshot.exists()){
    setDoc(DOC_REF, {
      people: state.people, items: [], shoppingLists: state.shoppingLists,
      updatedAt: Date.now(), lastWriter: clientId
    });
    return;
  }
  const data = snapshot.data();
  if(!data || !data.people) return;
  if(data.lastWriter === clientId) return;

  applyingRemote = true;
  state.people = data.people.slice();
  state.items = data.items ? JSON.parse(JSON.stringify(data.items)) : [];

  if(Array.isArray(data.shoppingLists) && data.shoppingLists.length){
    state.shoppingLists = JSON.parse(JSON.stringify(data.shoppingLists));
  }else if(Array.isArray(data.shopping) && data.shopping.length){
    state.shoppingLists = [{ id: newListId(), name: 'Lista de compras', items: JSON.parse(JSON.stringify(data.shopping)) }];
  }else if(!state.shoppingLists || !state.shoppingLists.length){
    state.shoppingLists = [{ id: newListId(), name: 'Lista de compras', items: [] }];
  }

  ensureCategories();

  if(viewListId && !state.shoppingLists.some(l => l.id === viewListId)) viewListId = null;
  if(form.editing && !state.items.some(x => x.id === form.editing)) resetForm();
  if(form.fromList && !state.shoppingLists.some(l => l.items.some(x => x.id === form.fromList))) form.fromList = null;
  form.who = form.who.filter(w => w < state.people.length);

  renderAll();
  applyingRemote = false;
  setSync('Sincronizado ✓', 'ok');
}, err => {
  console.error('Erro no listener:', err);
  setSync('Sem conexão', 'err');
});

// ============================================================
// FORMULÁRIO DO CARRINHO
// ============================================================
let form = { type: 'col', qty: 1, who: allIdx(), editing: null, fromList: null, fromListId: null };

function renderChips(){
  let h = '';
  state.people.forEach((n, i) => {
    const on = form.who.indexOf(i) > -1;
    h += '<button type="button" class="chip ' + (form.type === 'col' ? 'col' : 'ind') + (on ? ' on' : '') + '" data-i="' + i + '" aria-pressed="' + on + '">' + esc(n) + '</button>';
  });
  $('chips').innerHTML = h;
  $('who-label').textContent = form.type === 'col' ? 'Dividir entre:' : 'De quem é?';
  $('todos').style.display = form.type === 'col' ? '' : 'none';
  $('todos').textContent = form.who.length === state.people.length ? 'Limpar' : 'Todos';
}
function renderPreview(){
  const total = parsePrice($('preco').value) * form.qty;
  const el = $('preview');
  if(!total){ el.innerHTML = ''; return; }
  if(form.type === 'col'){
    if(!form.who.length){ el.innerHTML = ''; return; }
    const per = Math.ceil(total / form.who.length);
    el.innerHTML = 'Total <strong>' + brl(total) + '</strong> · cada um paga <strong>' + brl(per) + '</strong>';
  }else{
    el.innerHTML = 'Total <strong>' + brl(total) + '</strong>' + (form.who.length ? ' · ' + esc(state.people[form.who[0]]) : '');
  }
}
function setType(t){
  form.type = t;
  $('t-col').classList.toggle('on', t === 'col');
  $('t-ind').classList.toggle('on', t === 'ind');
  form.who = t === 'col' ? allIdx() : [];
  renderChips(); renderPreview();
}
function resetForm(){
  form.editing = null; form.fromList = null; form.fromListId = null; form.qty = 1;
  $('nome').value = ''; $('preco').value = ''; $('qtd').textContent = '1';
  $('form').classList.remove('editing');
  $('add').textContent = 'ADICIONAR ITEM';
  $('cancel').hidden = true; $('err').textContent = '';
  setType(form.type);
}

$('t-col').onclick = () => setType('col');
$('t-ind').onclick = () => setType('ind');
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  const i = +b.dataset.i;
  if(form.type === 'ind'){ form.who = [i]; }
  else{
    const k = form.who.indexOf(i);
    if(k > -1) form.who.splice(k, 1); else form.who.push(i);
    form.who.sort((a, b) => a - b);
  }
  $('err').textContent = '';
  renderChips(); renderPreview();
};
$('todos').onclick = () => {
  form.who = form.who.length === state.people.length ? [] : allIdx();
  renderChips(); renderPreview();
};
$('menos').onclick = () => { form.qty = Math.max(1, form.qty - 1); $('qtd').textContent = form.qty; renderPreview(); };
$('mais').onclick = () => { form.qty = Math.min(99, form.qty + 1); $('qtd').textContent = form.qty; renderPreview(); };
$('preco').oninput = renderPreview;
$('nome').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('preco').focus(); } });
$('preco').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addItem(); } });

function addItem(){
  const price = parsePrice($('preco').value);
  if(!price){ $('err').textContent = 'Digite o preço do item.'; $('preco').focus(); return; }
  if(!form.who.length){ $('err').textContent = form.type === 'col' ? 'Escolha pelo menos uma pessoa.' : 'Escolha de quem é o item.'; return; }

  const it = {
    id: form.editing || Date.now() + Math.random(),
    name: $('nome').value.trim() || 'Item sem nome',
    price, qty: form.qty, type: form.type, who: form.who.slice()
  };

  if(form.editing){
    state.items = state.items.map(x => x.id === form.editing ? it : x);
    toast('Item atualizado');
  }else{
    state.items.unshift(it);
    toast('Adicionado: ' + it.name);
    const key = norm(it.name);
    state.shoppingLists.forEach(l => {
      l.items.forEach(x => {
        if(x.done) return;
        if((form.fromListId === l.id && x.id === form.fromList) || norm(x.name) === key) x.done = true;
      });
    });
  }

  saveToCloud();
  resetForm();
  renderAll();
  $('nome').focus();
}
$('add').onclick = addItem;
$('cancel').onclick = resetForm;

// ============================================================
// CARRINHO
// ============================================================
function renderList(){
  const box = $('lista');
  $('count').textContent = state.items.length ? state.items.length + (state.items.length === 1 ? ' item' : ' itens') : '';
  if(!state.items.length){
    box.innerHTML = '<div class="empty">Carrinho vazio.<br>Adicione o primeiro item acima.</div>';
    return;
  }
  box.innerHTML = state.items.map(it => {
    const tot = itemTotal(it);
    let sub;
    if(it.type === 'col'){
      const all = it.who.length === state.people.length;
      const per = Math.ceil(tot / it.who.length);
      sub = '<b class="t-col">Coletivo</b> · ' + (all ? 'todos' : it.who.length + ' pessoas') + ' · ' + brl(per) + ' cada';
    }else{
      sub = '<b class="t-ind">Individual</b> · ' + esc(state.people[it.who[0]] || '?');
    }
    const q = it.qty > 1 ? ' <span style="color:var(--muted);font-weight:500">×' + it.qty + '</span>' : '';
    return '<div class="item ' + it.type + '"><div class="info"><div class="nm">' + esc(it.name) + q + '</div><div class="sub">' + sub + '</div></div><div class="val">' + brl(tot) + '</div><div class="acts"><button class="icon" data-edit="' + it.id + '" aria-label="Editar ' + esc(it.name) + '">✏️</button><button class="icon" data-del="' + it.id + '" aria-label="Remover ' + esc(it.name) + '">🗑️</button></div></div>';
  }).join('');
}
$('lista').onclick = e => {
  const d = e.target.closest('[data-del]'), ed = e.target.closest('[data-edit]');
  if(d){
    const id = d.dataset.del;
    const it = state.items.filter(x => String(x.id) === id)[0];
    state.items = state.items.filter(x => String(x.id) !== id);
    saveToCloud(); renderAll(); toast('Removido: ' + (it ? it.name : 'item'));
  }else if(ed){
    const id2 = ed.dataset.edit;
    const it2 = state.items.filter(x => String(x.id) === id2)[0];
    if(!it2) return;
    form.editing = it2.id; form.type = it2.type; form.qty = it2.qty; form.who = it2.who.slice();
    $('nome').value = it2.name;
    $('preco').value = (it2.price / 100).toFixed(2).replace('.', ',');
    $('qtd').textContent = it2.qty;
    $('t-col').classList.toggle('on', it2.type === 'col');
    $('t-ind').classList.toggle('on', it2.type === 'ind');
    $('form').classList.add('editing');
    $('add').textContent = 'SALVAR ALTERAÇÃO';
    $('cancel').hidden = false;
    renderChips(); renderPreview();
    goTab('itens');
    setTimeout(() => $('nome').focus(), 100);
  }
};

// ============================================================
// RESUMO
// ============================================================
function compute(){
  const res = state.people.map(() => ({ col: 0, ind: 0, lines: [] }));
  let total = 0;
  state.items.forEach(it => {
    const tot = itemTotal(it); total += tot;
    const parts = split(tot, it.who);
    it.who.forEach(p => {
      if(!res[p]) return;
      if(it.type === 'col') res[p].col += parts[p]; else res[p].ind += parts[p];
      res[p].lines.push({ name: it.name + (it.qty > 1 ? ' ×' + it.qty : ''), v: parts[p], type: it.type });
    });
  });
  return { res, total };
}
function renderSummary(){
  const c = compute();
  $('g-total').textContent = brl(c.total);
  const nc = state.items.filter(i => i.type === 'col').length;
  $('g-sub').textContent = state.items.length + ' itens · ' + nc + ' coletivos';
  const openIds = [];
  document.querySelectorAll('#cards details[open]').forEach(d => openIds.push(d.dataset.p));
  $('cards').innerHTML = state.people.map((n, i) => {
    const r = c.res[i], t = r.col + r.ind;
    const lines = r.lines.length ? r.lines.map(l =>
      '<div class="ln"><span>' + esc(l.name) + '<span class="tag ' + (l.type === 'col' ? 'c' : 'i') + '">' + (l.type === 'col' ? 'coletivo' : 'individual') + '</span></span><span>' + brl(l.v) + '</span></div>'
    ).join('') : '<div class="ln"><span style="color:var(--muted)">Nenhum item ainda</span></div>';
    return '<details class="card" data-p="' + i + '"' + (openIds.indexOf(String(i)) > -1 ? ' open' : '') + '><summary><div class="pn">' + esc(n) + '<small>coletivo ' + brl(r.col) + ' · individual ' + brl(r.ind) + '</small></div><div class="tot">' + brl(t) + '</div><span class="chev">›</span></summary><div class="body">' + lines + '</div></details>';
  }).join('');
  $('dock-total').textContent = brl(c.total);
}
$('copiar').onclick = () => {
  const c = compute();
  let txt = '🛒 CONEDU 2026 - SUPERMERCADO\nTotal: ' + brl(c.total) + '\n\n';
  state.people.forEach((n, i) => {
    const r = c.res[i];
    txt += n + ': ' + brl(r.col + r.ind) + ' (coletivo ' + brl(r.col) + ' + individual ' + brl(r.ind) + ')\n';
  });
  const done = () => toast('Resumo copiado!');
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild
