<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONEDU — Divisão de Gastos</title>
<link rel="icon" type="image/jpeg" href="public/images/conedu.jpg">
<link rel="apple-touch-icon" href="public/images/conedu.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f12;
    --surface:#161a20;
    --surface-2:#1c2129;
    --text:#eef1f6;
    --muted:#8b95a7;
    --brand:#3ddc97;
    --brand-soft:rgba(61,220,151,.12);
    --border:rgba(255,255,255,.07);
    --border-strong:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1000px 500px at 15% -10%, rgba(61,220,151,.14), transparent 60%),
      radial-gradient(800px 400px at 90% 110%, rgba(61,220,151,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Figtree',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .container{
    max-width:680px;width:100%;
    flex:1;display:flex;flex-direction:column;
  }

  /* Header */
  header{
    display:flex;align-items:center;gap:14px;
    margin-bottom:48px;
    animation:fadeIn .5s ease both;
  }
  .logo{
    width:52px;height:52px;border-radius:14px;
    object-fit:cover;
    border:1px solid var(--border-strong);
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(61,220,151,.15);
    background:var(--surface);
  }
  .brand h1{
    margin:0;
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:1.15rem;font-weight:700;letter-spacing:-.01em;
  }
  .brand p{
    margin:2px 0 0;color:var(--muted);
    font-size:.82rem;font-weight:500;
  }

  /* Hero */
  .hero{margin-bottom:36px;animation:fadeIn .5s .05s ease both}
  .hero h2{
    margin:0 0 10px;
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:2.1rem;font-weight:700;line-height:1.1;
    letter-spacing:-.035em;
  }
  .hero h2 span{
    color:var(--brand);
    background:linear-gradient(180deg, transparent 65%, var(--brand-soft) 65%);
    padding:0 4px;
  }
  .hero p{
    margin:0;color:var(--muted);
    font-size:1rem;line-height:1.55;
    max-width:500px;
  }

  /* Cards */
  .cards{
    display:grid;gap:14px;
    animation:fadeIn .5s .1s ease both;
  }
  .card{
    display:block;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 24px;
    text-decoration:none;color:inherit;
    position:relative;overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.7,.3,1),
               border-color .2s, box-shadow .2s, background .2s;
  }
  .card::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(400px 200px at 100% 0%, var(--brand-soft), transparent 70%);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(61,220,151,.35);
    box-shadow:0 20px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(61,220,151,.1);
    background:linear-gradient(180deg, rgba(61,220,151,.03), transparent), var(--surface-2);
  }
  .card:hover::after{opacity:1}
  .card > *{position:relative;z-index:1}
  .card .icon{
    font-size:1.9rem;margin-bottom:14px;
    display:inline-flex;align-items:center;justify-content:center;
    width:52px;height:52px;border-radius:14px;
    background:var(--brand-soft);
    border:1px solid rgba(61,220,151,.2);
  }
  .card h3{
    margin:0 0 6px;
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:1.15rem;font-weight:600;letter-spacing:-.01em;
  }
  .card p{
    margin:0;color:var(--muted);
    font-size:.9rem;line-height:1.5;
    max-width:90%;
  }
  .card .arrow{
    position:absolute;
    right:24px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:1.3rem;
    transition:transform .2s, color .2s;
  }
  .card:hover .arrow{
    transform:translateY(-50%) translateX(5px);
    color:var(--brand);
  }

  /* Footer */
  footer{
    margin-top:auto;padding-top:32px;
    color:var(--muted);font-size:.78rem;
    text-align:center;letter-spacing:.01em;
  }
  footer span{color:var(--brand)}

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <img src="public/images/conedu.jpg" alt="CONEDU" class="logo">
      <div class="brand">
        <h1>CONEDU</h1>
        <p>Divisão de gastos em grupo</p>
      </div>
    </header>

    <section class="hero">
      <h2>Divida sem <span>briga</span>.</h2>
      <p>Os dados são sincronizados em tempo real. Todos do grupo veem as mesmas informações no mesmo instante.</p>
    </section>

    <div class="cards">
      <a class="card" href="mercado/">
        <div class="icon">🛒</div>
        <h3>Divisão do Mercado</h3>
        <p>Adicione os itens, diga quem pagou e descubra quem deve quanto a quem.</p>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      Feito para simplificar <span>viagens em grupo</span>.
    </footer>
  </div>
</body>
</html>
