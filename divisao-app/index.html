<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divisão de Gastos</title>
<style>
  :root{--bg:#f1f3f5;--card:#fff;--text:#16181d;--muted:#6b7280;
    --brand:#2f7d4f;--border:#e3e6ea}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .wrap{max-width:720px;width:100%}
  h1{margin:0 0 8px;font-size:1.8rem;text-align:center}
  p.sub{margin:0 0 28px;text-align:center;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  a.card{display:block;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:24px;text-decoration:none;color:inherit;
    transition:transform .15s,box-shadow .15s,border-color .15s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);
    border-color:var(--brand)}
  .icone{font-size:2.4rem;margin-bottom:10px;display:block}
  a.card h2{margin:0 0 6px;font-size:1.15rem;color:var(--brand)}
  a.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}
</style>
</head>
<body>
  <div class="wrap">
    <h1>💸 Divisão de Gastos</h1>
    <p class="sub">Escolha o que você quer calcular</p>

    <div class="grid">
      <a class="card" href="mercado/">
        <span class="icone">🛒</span>
        <h2>Mercado</h2>
        <p>Divida a compra do supermercado entre o grupo, com itens coletivos e individuais.</p>
      </a>

      <a class="card" href="contas/">
        <span class="icone">🏠</span>
        <h2>Contas gerais</h2>
        <p>Despesas gerais divididas entre todos.</p>
      </a>

      <a class="card" href="divisao/">
        <span class="icone">🧮</span>
        <h2>Divisão avulsa</h2>
        <p>Divida uma conta qualquer rapidinho.</p>
      </a>
    </div>
  </div>
</body>
</html>
